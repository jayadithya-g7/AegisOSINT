<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%" style="background:#0b0f19; font-family:'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="gradHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="gradBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="600" y="45" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="bold" letter-spacing="1">AEGIS-OSINT MULTI-VECTOR ARCHITECTURE</text>
  <text x="600" y="70" text-anchor="middle" fill="#94a3b8" font-size="13">End-to-End Threat Intelligence, Entity Correlation, Risk Scoring &amp; Evidence Custody</text>

  <!-- Tier 1: Ingestion -->
  <rect x="50" y="100" width="1100" height="90" rx="10" fill="url(#gradBox)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="70" y="125" fill="#818cf8" font-size="12" font-weight="bold">TIER 1: MULTIMODAL INGESTION &amp; ACTIVE PROBING</text>
  
  <rect x="70" y="135" width="195" height="42" rx="6" fill="#1e1b4b" stroke="#6366f1"/>
  <text x="167" y="160" text-anchor="middle" fill="#e0e7ff" font-size="11">Typosquat / Combosquat</text>

  <rect x="285" y="135" width="195" height="42" rx="6" fill="#1e1b4b" stroke="#6366f1"/>
  <text x="382" y="160" text-anchor="middle" fill="#e0e7ff" font-size="11">Homoglyphs (IDN Punycode)</text>

  <rect x="500" y="135" width="195" height="42" rx="6" fill="#1e1b4b" stroke="#6366f1"/>
  <text x="597" y="160" text-anchor="middle" fill="#e0e7ff" font-size="11">DNS / RDAP / SSL Prober</text>

  <rect x="715" y="135" width="195" height="42" rx="6" fill="#1e1b4b" stroke="#6366f1"/>
  <text x="812" y="160" text-anchor="middle" fill="#e0e7ff" font-size="11">Social Media Harvester</text>

  <rect x="930" y="135" width="200" height="42" rx="6" fill="#1e1b4b" stroke="#6366f1"/>
  <text x="1030" y="160" text-anchor="middle" fill="#e0e7ff" font-size="11">Phishing Lure Ingestion</text>

  <!-- Flow Arrows 1 -> 2 -->
  <path d="M 600 190 L 600 220" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Tier 2: Forensics -->
  <rect x="50" y="220" width="1100" height="90" rx="10" fill="url(#gradBox)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="70" y="245" fill="#38bdf8" font-size="12" font-weight="bold">TIER 2: SPECIALIZED FORENSIC ENGINES</text>

  <rect x="70" y="255" width="250" height="42" rx="6" fill="#082f49" stroke="#0ea5e9"/>
  <text x="195" y="280" text-anchor="middle" fill="#e0f2fe" font-size="11">Perceptual Hashes (pHash / dHash)</text>

  <rect x="340" y="255" width="250" height="42" rx="6" fill="#082f49" stroke="#0ea5e9"/>
  <text x="465" y="280" text-anchor="middle" fill="#e0f2fe" font-size="11">Color Palette Histogram Match</text>

  <rect x="610" y="255" width="250" height="42" rx="6" fill="#082f49" stroke="#0ea5e9"/>
  <text x="735" y="280" text-anchor="middle" fill="#e0f2fe" font-size="11">Social Anomaly &amp; Badge Spoofing</text>

  <rect x="880" y="255" width="250" height="42" rx="6" fill="#082f49" stroke="#0ea5e9"/>
  <text x="1005" y="280" text-anchor="middle" fill="#e0f2fe" font-size="11">Psychological Coercion NLP</text>

  <!-- Flow Arrows 2 -> 3 -->
  <path d="M 600 310 L 600 340" stroke="#0ea5e9" stroke-width="2"/>

  <!-- Tier 3: Graph Link Analysis -->
  <rect x="50" y="340" width="1100" height="100" rx="10" fill="url(#gradBox)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="70" y="365" fill="#a855f7" font-size="12" font-weight="bold">TIER 3: HETEROGENEOUS ENTITY GRAPH &amp; LINK ANALYSIS</text>
  
  <rect x="70" y="380" width="330" height="45" rx="6" fill="#3b0764" stroke="#a855f7"/>
  <text x="235" y="407" text-anchor="middle" fill="#f3e8ff" font-size="11">Multi-Entity Graph (Domain, IP, ASN, SSL, Wallet)</text>

  <rect x="420" y="380" width="330" height="45" rx="6" fill="#3b0764" stroke="#a855f7"/>
  <text x="585" y="407" text-anchor="middle" fill="#f3e8ff" font-size="11">Degree &amp; Betweenness Centrality Hubs</text>

  <rect x="770" y="380" width="360" height="45" rx="6" fill="#3b0764" stroke="#a855f7"/>
  <text x="950" y="407" text-anchor="middle" fill="#f3e8ff" font-size="11">Connected Components &amp; Syndicate Clusters</text>

  <!-- Flow Arrows 3 -> 4 & 5 -->
  <path d="M 400 440 L 400 470" stroke="#a855f7" stroke-width="2"/>
  <path d="M 800 440 L 800 470" stroke="#a855f7" stroke-width="2"/>

  <!-- Split Tiers 4 and 5 -->
  <!-- Tier 4: Risk Scoring -->
  <rect x="50" y="470" width="535" height="120" rx="10" fill="url(#gradBox)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="70" y="495" fill="#f59e0b" font-size="12" font-weight="bold">TIER 4: MULTI-FACTOR CALIBRATED RISK ENGINE</text>
  <text x="70" y="525" fill="#cbd5e1" font-size="11">Formula: R = Σ (w_k * S_k) + Synergy Bonus</text>
  <text x="70" y="545" fill="#94a3b8" font-size="11">Weights: Domain(0.25) + Infra(0.20) + Visual(0.20) + NLP(0.15) + Social(0.10) + Graph(0.10)</text>
  <rect x="70" y="555" width="495" height="24" rx="4" fill="#451a03" stroke="#f59e0b"/>
  <text x="317" y="571" text-anchor="middle" fill="#fef3c7" font-size="10" font-weight="bold">Tiers: CRITICAL (80-100) | HIGH (60-79) | MEDIUM (40-59) | LOW | BENIGN</text>

  <!-- Tier 5: Evidence Locker -->
  <rect x="615" y="470" width="535" height="120" rx="10" fill="url(#gradBox)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="635" y="495" fill="#10b981" font-size="12" font-weight="bold">TIER 5: EVIDENCE LOCKER (NIST SP 800-86)</text>
  <text x="635" y="525" fill="#cbd5e1" font-size="11">Cryptographic Hashing: Parallel SHA-256 and SHA3-512</text>
  <text x="635" y="545" fill="#94a3b8" font-size="11">Chain-of-Custody: Immutable Hash-Chained Audit Ledger</text>
  <rect x="635" y="555" width="495" height="24" rx="4" fill="#064e3b" stroke="#10b981"/>
  <text x="882" y="571" text-anchor="middle" fill="#d1fae5" font-size="10" font-weight="bold">Tamper Verification Seal: HMAC-SHA256 Digital Signature</text>

  <!-- Flow Arrows to Tier 6 -->
  <path d="M 317 590 L 317 620" stroke="#f59e0b" stroke-width="2"/>
  <path d="M 882 590 L 882 620" stroke="#10b981" stroke-width="2"/>

  <!-- Tier 6: Remediation & Reports -->
  <rect x="50" y="620" width="1100" height="90" rx="10" fill="url(#gradBox)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="70" y="645" fill="#ec4899" font-size="12" font-weight="bold">TIER 6: ACTIONABLE REMEDIATION &amp; TAKEDOWN STUDIO</text>

  <rect x="70" y="655" width="250" height="42" rx="6" fill="#500724" stroke="#ec4899"/>
  <text x="195" y="680" text-anchor="middle" fill="#fce7f3" font-size="11">ICANN Section 3.18 Abuse Letters</text>

  <rect x="340" y="655" width="250" height="42" rx="6" fill="#500724" stroke="#ec4899"/>
  <text x="465" y="680" text-anchor="middle" fill="#fce7f3" font-size="11">Hosting Cease &amp; Desist Notices</text>

  <rect x="610" y="655" width="250" height="42" rx="6" fill="#500724" stroke="#ec4899"/>
  <text x="735" y="680" text-anchor="middle" fill="#fce7f3" font-size="11">OASIS STIX 2.1 Threat Intel Bundles</text>

  <rect x="880" y="655" width="250" height="42" rx="6" fill="#500724" stroke="#ec4899"/>
  <text x="1005" y="680" text-anchor="middle" fill="#fce7f3" font-size="11">Courtroom Admissible Dossiers</text>

  <!-- Bottom Interactive Workbench Banner -->
  <rect x="50" y="730" width="1100" height="45" rx="8" fill="url(#gradHeader)"/>
  <text x="600" y="758" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">TIER 7: INTERACTIVE CYBER THREAT INTELLIGENCE WORKBENCH (FastAPI + Cytoscape.js UI)</text>
</svg>
